name: autofix.ci # needed to securely identify the workflow

on: [push, pull_request]

permissions:
  contents: read

jobs:
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    steps:
      - name: Install Fish shell
        uses: fish-shop/install-fish-shell@c7854a53788db0cf0ac377b7320e6814b6078d3f # v2
        background: true

      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          working-directory: tools/sprite
          cache: true

      - wait-all:

      - name: Fix formatting
        run: fish_indent --write ./**/*.fish

      - run: pnpm format:fix
        working-directory: tools/sprite
        continue-on-error: true

      - run: pnpm lint:fix
        working-directory: tools/sprite
        continue-on-error: true

      - name: Run autofix.ci
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1
