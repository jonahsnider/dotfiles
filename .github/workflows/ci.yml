name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  sprite:
    name: Sprite tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/sprite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          working-directory: tools/sprite
          cache: true
      - parallel:
          - run: pnpm format
          - run: pnpm lint
          - run: pnpm test
          - run: pnpm knip
          - run: pnpm build
