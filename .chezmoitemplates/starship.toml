"$schema" = 'https://starship.rs/config-schema.json'

# Don't print a new line at the start of the prompt
add_newline = false

# https://starship.rs/config/#prompt
# Keep custom placements while inheriting the default order for other modules.
format = """$username$hostname$localip$time\
$all\
$line_break$directory$status$os$container$shell$character"""

# Time module
[time]
disabled = false
time_format = "%I:%M %p"
use_12hr = true

# Directory listing
[directory]
fish_style_pwd_dir_length = 1
truncation_length = 2

# Character before prompt
[character]
error_symbol = "[∴](bold red)"
success_symbol = "[∴](bold green)"

# Battery monitor
[battery]
format = "at [$percentage]($style) battery "
disabled = true

[[battery.display]]
style = "bold #ff5555"
threshold = 15
[[battery.display]]
style = "bold #ffb86c"
threshold = 33
[[battery.display]]
style = "bold #f1fa8c"
threshold = 66
[[battery.display]]
style = "bold #50fa7b"
threshold = 100

# Make git commit joined with the branch
[git_branch]
# No trailing space in quote
format = "on [$symbol$branch]($style)"

# Show current git commit
[git_commit]
only_detached = false
format = "[@$hash]($style) "

[git_status]
deleted = "󰆴"

[username]
format = "[$user]($style)@"
show_always = true

[hostname]
format = "[$hostname]($style) "
ssh_only = false
style = "green"

[java]
style = "red"

[aws]
disabled = true

[docker_context]
disabled = true

[gcloud]
disabled = true

[custom.sup]
description = "Sanity local stack status"
when = 'test -n "$SUP_CONFIG" && command -v sup >/dev/null 2>&1'
command = "sup prompt"
shell = ["sh"]
format = "running ([$symbol$output]($style) )"
# Sanity devicon
symbol = " "
style = "bold #ff5500"
