[providers]
personal = { type = "1password", vault = "Personal", account = "my.1password.com" }
sanity = { type = "1password", vault = "Employee", account = "sanity.1password.com" }

[secrets]
CIRCLECI_PERSONAL_API_TOKEN = { provider = "sanity", value = "CircleCI Personal API Token/password" }
GITHUB_PAT_JETBRAINS = { provider = "personal", value = "GitHub PAT - JetBrains/password" }
LAZYRENO_GITHUB_ACCESS_TOKEN = { provider = "personal", value = "lazyreno GitHub access token/token" }
LAZYRENO_RENOVATE_API_SECRET = { provider = "personal", value = "Renovate CE API server secret/password" }
MODAL_TOKEN_ID = { provider = "personal", value = "Modal API token/username" }
MODAL_TOKEN_SECRET = { provider = "personal", value = "Modal API token/credential" }
NPM_TOKEN = { provider = "personal", value = "npm Token/password" }
ARGOCD_AUTH_TOKEN = { provider = "sanity", value = "ArgoCD auth-token/password"}
